<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatWave</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0e14;
    --surface: #13141c;
    --surface2: #1a1b26;
    --border: #252636;
    --accent: #7c6af7;
    --accent2: #56cfb2;
    --accent3: #f7956a;
    --text: #e2e4f0;
    --text2: #8b8fa8;
    --text3: #5a5d72;
    --danger: #f7716a;
    --online: #4cc9a0;
    --radius: 14px;
    --font: 'DM Sans', sans-serif;
    --mono: 'DM Mono', monospace;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* LOGIN SCREEN */
  #login-screen {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    background-image: radial-gradient(ellipse at 20% 50%, rgba(124,106,247,0.08) 0%, transparent 60%),
                      radial-gradient(ellipse at 80% 20%, rgba(86,207,178,0.06) 0%, transparent 50%);
  }

  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 48px 40px;
    width: 400px;
    box-shadow: 0 40px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(124,106,247,0.1);
    animation: slideUp 0.4s ease;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .login-logo {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 32px;
  }

  .logo-icon {
    width: 44px; height: 44px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }

  .logo-text {
    font-size: 22px; font-weight: 600; letter-spacing: -0.3px;
  }

  .login-title { font-size: 26px; font-weight: 600; margin-bottom: 6px; letter-spacing: -0.4px; }
  .login-sub   { color: var(--text2); font-size: 14px; margin-bottom: 32px; }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; font-weight: 500; color: var(--text2); margin-bottom: 8px; letter-spacing: 0.5px; text-transform: uppercase; }
  .field input, .field select {
    width: 100%;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    padding: 12px 14px;
    border-radius: 10px;
    outline: none;
    transition: border-color 0.2s;
  }
  .field input:focus, .field select:focus { border-color: var(--accent); }
  .field select option { background: var(--surface2); }

  .btn-primary {
    width: 100%; padding: 13px;
    background: linear-gradient(135deg, var(--accent), #6358d4);
    color: #fff; font-family: var(--font); font-size: 15px; font-weight: 600;
    border: none; border-radius: 10px; cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    margin-top: 8px;
    letter-spacing: -0.2px;
  }
  .btn-primary:hover { opacity: 0.9; }
  .btn-primary:active { transform: scale(0.98); }

  /* MAIN APP */
  #app { display: none; height: 100vh; flex-direction: column; }
  #app.active { display: flex; }

  /* TOP BAR */
  .topbar {
    height: 56px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 20px; gap: 12px;
    flex-shrink: 0;
  }
  .topbar-logo { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 16px; }
  .topbar-logo .logo-icon { width: 30px; height: 30px; font-size: 14px; border-radius: 8px; }
  .topbar-room { font-weight: 600; font-size: 15px; }
  .topbar-room span { color: var(--text2); font-weight: 400; }
  .conn-status {
    margin-left: auto; display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--text2);
  }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text3); }
  .status-dot.connected { background: var(--online); box-shadow: 0 0 6px var(--online); }

  /* MAIN LAYOUT */
  .main { display: flex; flex: 1; overflow: hidden; }

  /* SIDEBAR */
  .sidebar {
    width: 220px; flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .sidebar-section { padding: 16px 12px 8px; }
  .sidebar-label { font-size: 10px; font-weight: 600; color: var(--text3); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }

  .room-btn {
    width: 100%; text-align: left; background: none; border: none;
    color: var(--text2); font-family: var(--font); font-size: 14px; font-weight: 500;
    padding: 7px 10px; border-radius: 8px; cursor: pointer;
    transition: background 0.15s, color 0.15s;
    display: flex; align-items: center; gap: 6px;
  }
  .room-btn:hover { background: var(--surface2); color: var(--text); }
  .room-btn.active { background: rgba(124,106,247,0.15); color: var(--accent); }

  .user-list { padding: 0 12px 12px; flex: 1; overflow-y: auto; }
  .user-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; border-radius: 8px; font-size: 13px; color: var(--text2);
  }
  .user-avatar {
    width: 24px; height: 24px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: #fff; flex-shrink: 0;
  }

  /* CHAT AREA */
  .chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  #messages {
    flex: 1; overflow-y: auto; padding: 20px 24px;
    display: flex; flex-direction: column; gap: 4px;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }

  .msg {
    display: flex; gap: 10px; padding: 4px 0;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  .msg-avatar {
    width: 32px; height: 32px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: #fff; flex-shrink: 0;
    margin-top: 2px;
  }

  .msg-body { flex: 1; }
  .msg-header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
  .msg-user { font-size: 13px; font-weight: 600; }
  .msg-time { font-size: 11px; color: var(--text3); font-family: var(--mono); }
  .msg-text { font-size: 14px; line-height: 1.55; color: var(--text); }

  .msg.mine .msg-avatar { order: 2; }
  .msg.mine .msg-body { order: 1; text-align: right; }
  .msg.mine .msg-header { flex-direction: row-reverse; }
  .msg.mine .msg-text {
    background: linear-gradient(135deg, var(--accent), #6358d4);
    display: inline-block; padding: 8px 14px; border-radius: 14px 4px 14px 14px;
    color: #fff; text-align: left;
  }

  .msg-system {
    text-align: center; font-size: 12px; color: var(--text3);
    padding: 6px 0; font-style: italic;
  }

  /* TYPING INDICATOR */
  #typing-bar {
    height: 24px; padding: 0 24px;
    font-size: 12px; color: var(--text2); display: flex; align-items: center; gap: 6px;
  }
  .typing-dots span {
    display: inline-block; width: 4px; height: 4px; border-radius: 50%;
    background: var(--text2); margin: 0 1px;
    animation: bounce 1.2s infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,80%,100% { transform: translateY(0); } 40% { transform: translateY(-4px); } }

  /* INPUT BAR */
  .input-bar {
    padding: 12px 20px 16px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex; gap: 10px; align-items: flex-end;
  }

  #msg-input {
    flex: 1; background: var(--surface2); border: 1.5px solid var(--border);
    color: var(--text); font-family: var(--font); font-size: 14px;
    padding: 11px 16px; border-radius: 12px; outline: none; resize: none;
    min-height: 44px; max-height: 120px;
    transition: border-color 0.2s;
    line-height: 1.5;
  }
  #msg-input:focus { border-color: var(--accent); }
  #msg-input::placeholder { color: var(--text3); }

  .emoji-btn, .send-btn {
    width: 44px; height: 44px; border: none; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 18px; transition: all 0.15s;
    flex-shrink: 0;
  }
  .emoji-btn { background: var(--surface2); color: var(--text2); position: relative; }
  .emoji-btn:hover { background: var(--border); }

  .send-btn {
    background: linear-gradient(135deg, var(--accent), #6358d4);
    color: #fff;
  }
  .send-btn:hover { opacity: 0.85; }
  .send-btn:active { transform: scale(0.94); }

  /* EMOJI PICKER */
  .emoji-picker {
    position: absolute; bottom: 60px; left: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    display: none; flex-wrap: wrap; gap: 4px;
    width: 260px; max-height: 200px; overflow-y: auto;
    z-index: 10;
  }
  .emoji-picker.open { display: flex; }
  .emoji-opt {
    font-size: 20px; padding: 4px; cursor: pointer; border-radius: 6px;
    transition: background 0.1s;
  }
  .emoji-opt:hover { background: var(--surface2); }

  /* COLORS */
  .c0 { background: #7c6af7; }
  .c1 { background: #56cfb2; }
  .c2 { background: #f7956a; }
  .c3 { background: #f7716a; }
  .c4 { background: #f7c76a; color: #333 !important; }
  .c5 { background: #6ab4f7; }
  .c6 { background: #c76af7; }
  .c7 { background: #4cc9a0; }

  /* NOTIFICATION TOAST */
  #toast {
    position: fixed; top: 20px; right: 20px;
    background: var(--surface); border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 10px; padding: 12px 16px;
    font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    transform: translateX(120%); transition: transform 0.3s ease;
    z-index: 999; max-width: 260px;
  }
  #toast.show { transform: translateX(0); }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon">💬</div>
      <span class="logo-text">ChatWave</span>
    </div>
    <h1 class="login-title">Join the conversation</h1>
    <p class="login-sub">Pick a username and start chatting instantly</p>
    <div class="field">
      <label>Username</label>
      <input type="text" id="username-input" placeholder="e.g. cooldev42" maxlength="20" autocomplete="off">
    </div>
    <div class="field">
      <label>Room</label>
      <select id="room-select">
        <option value="general"># general</option>
        <option value="random"># random</option>
        <option value="tech"># tech</option>
      </select>
    </div>
    <button class="btn-primary" onclick="joinChat()">Enter Chat →</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="topbar-logo"><div class="logo-icon">💬</div> ChatWave</div>
    <div class="topbar-room"><span>#</span> <span id="current-room-label">general</span></div>
    <div class="conn-status">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">Connecting...</span>
    </div>
  </div>

  <div class="main">
    <div class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-label">Rooms</div>
        <button class="room-btn active" onclick="switchRoom('general')" id="room-general">💬 general</button>
        <button class="room-btn" onclick="switchRoom('random')" id="room-random">🎲 random</button>
        <button class="room-btn" onclick="switchRoom('tech')" id="room-tech">💻 tech</button>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">Online</div>
      </div>
      <div class="user-list" id="user-list"></div>
    </div>

    <div class="chat-area">
      <div id="messages"></div>
      <div id="typing-bar"></div>
      <div class="input-bar" style="position:relative">
        <div class="emoji-picker" id="emoji-picker"></div>
        <button class="emoji-btn" id="emoji-toggle" onclick="toggleEmoji()">😊</button>
        <textarea id="msg-input" placeholder="Message #general..." rows="1" oninput="autoResize(this); onType()"></textarea>
        <button class="send-btn" onclick="sendMessage()">➤</button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  let ws, username, currentRoom;
  let typingTimer, isTyping = false;
  const colors = ['c0','c1','c2','c3','c4','c5','c6','c7'];
  const userColors = {};
  const typingUsers = new Set();

  const EMOJIS = ['😊','😂','❤️','🔥','👍','🎉','🙌','💯','😎','🤔',
                  '😅','🥳','💪','✨','🚀','👀','💬','🙏','😍','🤣',
                  '😢','😡','🤯','💡','⚡','🎯','🌟','👋','🍕','🎸'];

  // Build emoji picker
  const picker = document.getElementById('emoji-picker');
  EMOJIS.forEach(e => {
    const el = document.createElement('span');
    el.className = 'emoji-opt'; el.textContent = e;
    el.onclick = () => { insertEmoji(e); toggleEmoji(false); };
    picker.appendChild(el);
  });

  function getColor(name) {
    if (!userColors[name]) {
      let h = 0;
      for (let c of name) h = ((h << 5) - h) + c.charCodeAt(0);
      userColors[name] = colors[Math.abs(h) % colors.length];
    }
    return userColors[name];
  }

  function joinChat() {
    const u = document.getElementById('username-input').value.trim();
    if (!u) { document.getElementById('username-input').focus(); return; }
    username = u;
    currentRoom = document.getElementById('room-select').value;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').classList.add('active');
    document.getElementById('msg-input').placeholder = `Message #${currentRoom}...`;
    connect();
  }

  function connect() {
    ws = new WebSocket('ws://localhost:8765');

    ws.onopen = () => {
      setStatus(true);
      ws.send(JSON.stringify({ type: 'join', username, room: currentRoom }));
    };

    ws.onclose = () => {
      setStatus(false);
      setTimeout(connect, 3000);
    };

    ws.onmessage = ({ data }) => {
      const msg = JSON.parse(data);
      if      (msg.type === 'message')   renderMessage(msg);
      else if (msg.type === 'system')    renderSystem(msg);
      else if (msg.type === 'history')   msg.messages.forEach(m => renderMessage(m, true));
      else if (msg.type === 'user_list') renderUserList(msg.users);
      else if (msg.type === 'typing')    handleTyping(msg);
    };
  }

  function setStatus(on) {
    document.getElementById('status-dot').className = 'status-dot' + (on ? ' connected' : '');
    document.getElementById('status-text').textContent = on ? 'Connected' : 'Reconnecting...';
  }

  function renderMessage(msg, prepend = false) {
    const box = document.getElementById('messages');
    const mine = msg.username === username;
    const color = getColor(msg.username);
    const initial = msg.username[0].toUpperCase();

    const el = document.createElement('div');
    el.className = 'msg' + (mine ? ' mine' : '');
    el.innerHTML = `
      <div class="msg-avatar ${color}">${initial}</div>
      <div class="msg-body">
        <div class="msg-header">
          <span class="msg-user ${color}" style="color:inherit;filter:brightness(1.6)">${escHtml(msg.username)}</span>
          <span class="msg-time">${msg.timestamp}</span>
        </div>
        <div class="msg-text">${escHtml(msg.text)}</div>
      </div>`;
    box.appendChild(el);
    box.scrollTop = box.scrollHeight;

    // Notification if not visible
    if (!mine && document.hidden) showToast(`${msg.username}: ${msg.text}`);
  }

  function renderSystem(msg) {
    const box = document.getElementById('messages');
    const el = document.createElement('div');
    el.className = 'msg-system';
    el.textContent = msg.text;
    box.appendChild(el);
    box.scrollTop = box.scrollHeight;
  }

  function renderUserList(users) {
    const el = document.getElementById('user-list');
    el.innerHTML = users.map(u => `
      <div class="user-item">
        <div class="user-avatar ${getColor(u)}">${u[0].toUpperCase()}</div>
        <span>${escHtml(u)}</span>
      </div>`).join('');
  }

  function handleTyping(msg) {
    if (msg.isTyping) typingUsers.add(msg.username);
    else typingUsers.delete(msg.username);
    const bar = document.getElementById('typing-bar');
    if (typingUsers.size === 0) { bar.innerHTML = ''; return; }
    const names = [...typingUsers].join(', ');
    bar.innerHTML = `<div class="typing-dots"><span></span><span></span><span></span></div> <span>${names} ${typingUsers.size === 1 ? 'is' : 'are'} typing…</span>`;
  }

  function sendMessage() {
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    if (!text || !ws || ws.readyState !== 1) return;
    ws.send(JSON.stringify({ type: 'message', text }));
    input.value = ''; input.style.height = '';
    stopTyping();
  }

  function switchRoom(room) {
    if (room === currentRoom) return;
    document.getElementById('messages').innerHTML = '';
    document.querySelectorAll('.room-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('room-' + room).classList.add('active');
    currentRoom = room;
    document.getElementById('current-room-label').textContent = room;
    document.getElementById('msg-input').placeholder = `Message #${room}...`;
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'join', username, room }));
  }

  function onType() {
    if (!isTyping) { isTyping = true; ws?.send(JSON.stringify({ type: 'typing', isTyping: true })); }
    clearTimeout(typingTimer);
    typingTimer = setTimeout(stopTyping, 1500);
  }

  function stopTyping() {
    if (isTyping) { isTyping = false; ws?.send(JSON.stringify({ type: 'typing', isTyping: false })); }
    clearTimeout(typingTimer);
  }

  function toggleEmoji(force) {
    const p = document.getElementById('emoji-picker');
    const open = force !== undefined ? force : !p.classList.contains('open');
    p.classList.toggle('open', open);
  }

  function insertEmoji(e) {
    const inp = document.getElementById('msg-input');
    const s = inp.selectionStart, end = inp.selectionEnd;
    inp.value = inp.value.slice(0, s) + e + inp.value.slice(end);
    inp.selectionStart = inp.selectionEnd = s + e.length;
    inp.focus();
  }

  function autoResize(el) {
    el.style.height = ''; el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  // Keyboard
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && document.activeElement.id === 'msg-input') {
      e.preventDefault(); sendMessage();
    }
    if (e.key === 'Escape') toggleEmoji(false);
  });

  document.getElementById('username-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') joinChat();
  });

  document.addEventListener('click', e => {
    if (!e.target.closest('.emoji-btn') && !e.target.closest('.emoji-picker')) toggleEmoji(false);
  });
</script>
</body>
</html>
